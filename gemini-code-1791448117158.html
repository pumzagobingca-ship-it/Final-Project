<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Gallery Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Gallery Overview</h1>
  </header>

  <main>
    <p>This gallery displays a curated collection of modern designs, showcasing custom layouts and responsive image arrangements tailored for all device sizes.</p>

    <div class="gallery">
      <figure>
        <img src="images/Yellow.png" alt="Bright yellow texture display">
        <figcaption>Yellow Sample</figcaption>
      </figure>

      <figure>
        <img src="images/Blue.png" alt="Deep blue abstract design">
        <figcaption>Blue Sample</figcaption>
      </figure>

      <figure>
        <img src="images/Red.jpeg" alt="Vibrant red color pattern">
        <figcaption>Red Sample</figcaption>
      </figure>
    </div>
  </main>

</body>
</html>
